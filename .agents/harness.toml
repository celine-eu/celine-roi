# What this repository declares about itself to the agent harness checker.
#
# Absent is legal: with no file here the rules apply exactly as written, which is the
# right starting point. Add a section only when this repository genuinely differs —
# every entry below is a claim a reviewer can disagree with, which is the point of
# writing it down rather than teaching the checker about you.
#
# Run `python -m harness .` to see the effect of a change.

version = 1

# ---------------------------------------------------------------------------
# [requirements] — the shape of a requirement identifier.
#
# The default is REQ- followed by four digits. Change it only if this repository
# already numbers its requirements another way; a trailing slug
# (`REQ-0142-session-signing`) is cosmetic either way and is ignored.
# ---------------------------------------------------------------------------
[requirements]
pattern = "REQ-[0-9]{4}"

# ---------------------------------------------------------------------------
# [traceability] — who answers "is this requirement verified?".
#
#   provider = "harness"   this checker does, from docs/specifications/ and the
#                          @verifies tags on tests. The default.
#   provider = "external"  a tool this repository already has does. Name it. The
#                          requirements it covers are then reported DELEGATED rather
#                          than passing quietly — the report names the owner.
#
# Delegating is not an exemption and not a failure. It is the correct answer when a
# repository already has a requirement universe and an evidence syntax of its own:
# importing a second one adds an identifier namespace and a marker syntax that
# measure nothing new.
# ---------------------------------------------------------------------------
# This repository traces its own requirements, as of 2026-08-15. They live in
# docs/specifications/ and were extracted from the test suite rather than written ahead
# of it — see that directory's index.md for what that does and does not claim.
#
# A test declares what it covers with `@verifies REQ-####` in the docstring of the test
# class, one requirement per class, several tags where a class genuinely covers several.
[traceability]
provider = "harness"

# ---------------------------------------------------------------------------
# [agents] — directories under .agents/ beyond the closed set.
#
# The set is knowledge, playbooks, plans, trace, work. A repository that keeps
# something else there declares it, so the addition is deliberate and reviewable
# rather than a directory that appeared one day.
# ---------------------------------------------------------------------------
# [agents]
# extra_dirs = []

# ---------------------------------------------------------------------------
# [defects] — where defects live, which is never .agents/.
#
# Named here only so the checker can say where they belong when it finds a ledger
# file that has grown back.
# ---------------------------------------------------------------------------
# [defects]
# tracker = "github-issues"
