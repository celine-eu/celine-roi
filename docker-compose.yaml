services:
  create-db:
    image: postgres:17
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGPASSWORD: securepassword123
    command: >-
      sh -c "psql -h host.docker.internal -p 15432 -U postgres -tc \"SELECT 1
      FROM pg_database WHERE datname='roi'\" | grep -q 1 || createdb -h
      host.docker.internal -p 15432 -U postgres roi"

  init:
    build:
      context: ./
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    depends_on:
      create-db:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8018:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
