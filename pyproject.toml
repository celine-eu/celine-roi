[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celine-roi"
version = "0.1.0"
description = "Financial decision engine for Italian PV systems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "numpy-financial>=1.0",
    "pvlib>=0.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
celine-roi = "celine.roi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
