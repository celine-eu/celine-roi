[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "celine-roi"
version = "1.10.3"
description = "Financial decision engine for Italian PV systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.5",
    "numpy-financial>=1.0",
    "pvlib>=0.15.1",
    "pandas>=3.0.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.46.0",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.14.1",
    "psycopg2-binary>=2.9.12",
]

[project.scripts]
celine-roi = "celine.roi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "python-semantic-release>=10.5.3",
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.15.12",
    "black>=24.0",
    "mypy>=1.20.2",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"

upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
