# CELINE ROI — Incentive parameters
# Source: Decreto CACER D.M. 414/2023, ARERA 727/2022, Circolari AdE
# Last updated: 2026-03-25

# RID (Ritiro Dedicato)
rid_tariff: 0.07             # EUR/kWh average (range: 0.04-0.12, PMZ zonale)

# CER/TIAD (Decreto CACER D.M. 414/2023)
# CRITICAL: CER TIP is FIXED nominal for 20 years. NEVER apply inflation.
cer_tip: 0.09                # EUR/kWh (90 EUR/MWh, includes North Italy bonus)
cer_cacv: 0.0085             # EUR/kWh (8.5 EUR/MWh, ARERA Cacv component)
cer_duration_years: 20       # CER incentive duration (fixed by decree)
cer_libero_ratio: 0.55       # 55% of CER incentive is "libero" (available to producer)
                             # 45% is "vincolato" (must be distributed to CER members)
                             # Source: DM CACER D.M. 414/2023, Art. 7

# Depreciation — mobile asset (roof-mounted, <150m3)
# Source: Circolari AdE 46/E/2007, 36/E/2013
depreciation_coeff: 0.09     # 9%/year (~11 years full depreciation)
depreciation_first_year_factor: 0.5  # 50% of coefficient in year 1

# Detrazione fiscale IRPEF -- residential PV (Bonus Ristrutturazione)
# Source: Art. 16-bis TUIR, Legge di Bilancio 2025, proroghe 2026-2027
# Rates valid for expenses in 2026. Update when year changes.
# 2027: primary=0.36, other=0.30. 2028+: both=0.30.
detrazione_rate_primary: 0.50       # Abitazione principale (2026)
detrazione_rate_other: 0.36         # Other residential (2026)
detrazione_years: 10                # 10 equal annual installments
detrazione_max_eur: 96000           # Cap per unita immobiliare
detrazione_max_kwp: 20.0            # Only systems <= 20 kWp
detrazione_include_iva: true        # When true, deductible base = CAPEX × (1 + IVA rate)
                                    # Italian IRPEF deduction applies to gross amount (IVA inclusa)
detrazione_eligible_types:
  - residential
